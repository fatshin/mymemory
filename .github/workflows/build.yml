name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (iOS Simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project MyMemory.xcodeproj -scheme MyMemory \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | tail -n 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
