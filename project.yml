name: MyMemory
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
options:
  bundleIdPrefix: com.fatshin
  deploymentTarget:
    iOS: "26.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  # 日本向けのアプリ。日付や購入画面の表示を日本語にする
  developmentLanguage: ja
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 0.18.0
targets:
  MyMemory:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - package: WhisperKit
      - target: MyMemoryWatch
    scheme:
      testTargets: [MyMemoryTests]
      # 商品を App Store Connect に登録する前に、シミュレータで購入を試すためのローカル設定
      storeKitConfiguration: StoreKit/MyMemory.storekit
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: MyMemory
        CFBundleLocalizations: [ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: 録音データの再生・文字起こしに使用します
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.fatshin.mymemory.transcribe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatshin.mymemory
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  MyMemoryWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: MyMemory
        CFBundleLocalizations: [ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.fatshin.mymemory
        # 録音は前面で開始し、画面が消えても続ける (Apple: 開始後はバックグラウンドでも録音を継続できる)
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: 一日の会話を録音します
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatshin.mymemory.watchkitapp
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  MyMemoryTests:
    type: bundle.unit-test
    platform: iOS
    # 電力判定は UIKit 非依存の純粋関数のため、ソースを直接取り込んでテストする。
    sources: [Tests, iOS/PowerPolicy.swift, iOS/RetryPolicy.swift, iOS/TextChunker.swift, iOS/ExportFormatter.swift, iOS/UsageQuota.swift, iOS/RetentionPolicy.swift, iOS/SummarySections.swift, iOS/TranscriptCleaner.swift, Shared/RecoveryBudget.swift, Shared/AutoResumePolicy.swift, Shared/ChunkWriter.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatshin.mymemory.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
